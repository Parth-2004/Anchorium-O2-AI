[project]
name = "anchorium-rag-pipeline"
version = "1.0.0"
description = "Cross-Border Legal & Regulatory RAG Pipeline — Automated Compliance Copilot for GIFT City OBU Lending"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Anchorium", email = "engineering@anchorium.com" },
]

dependencies = [
    # Configuration & Validation
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",

    # CLI
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",

    # PDF Ingestion
    "pdfplumber>=0.11,<1.0",
    "unstructured[pdf]>=0.14",

    # Embeddings & LLM
    "openai>=1.35,<2.0",

    # Vector Database
    "pinecone>=4.0,<5.0",

    # Sparse Search
    "rank-bm25>=0.2.2,<1.0",

    # Reranking
    "cohere>=5.5,<6.0",

    # Observability & Tracing
    "langsmith>=0.1,<1.0",

    # Resilience
    "tenacity>=8.3,<10.0",

    # Structured Logging
    "structlog>=24.2,<26.0",

    # Tokenization (for chunk size control)
    "tiktoken>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

voyage = [
    "voyageai>=0.4,<1.0",
]

[project.scripts]
anchorium-rag = "rag_pipeline.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
