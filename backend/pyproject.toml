[project]
name = "anchorium-omni-engine"
version = "0.1.0"
description = "Anchorium Omni-Engine — Zero-Knowledge Multi-Agent Backend for cross-border credit underwriting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # RAG Pipeline dependencies
    "pdfplumber>=0.11,<1.0",
    "openai>=1.35,<2.0",
    "pinecone>=4.0,<5.0",
    "rank-bm25>=0.2.2,<1.0",
    "cohere>=5.5,<6.0",
    "langsmith>=0.1,<1.0",
    "tenacity>=8.3,<10.0",
    "structlog>=24.2,<26.0",
    "tiktoken>=0.7,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
